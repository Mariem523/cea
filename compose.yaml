# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zellis_database
      POSTGRES_USER: zellis_user
      POSTGRES_PASSWORD: zellis_password
    ports:
      - "5432:5432"        # optional for host access
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zellis_user -d zellis_database"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: .
    environment:
      POSTGRES_DB: zellis_database
      POSTGRES_USER: zellis_user
      POSTGRES_PASSWORD: zellis_password
      DB_HOST: db           # <-- this is the key
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
volumes:
  pgdata:


